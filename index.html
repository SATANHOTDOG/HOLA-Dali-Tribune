<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOLA 業績處刑台 - 脊椎拯救戰報</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --text-color: #e0e0e0;
            --accent-color: #d32f2f;
            --border-color: #333;
            --highlight: #ff5252;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
            line-height: 1.4;
        }
        h1, h2 {
            color: var(--highlight);
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        h2 { font-size: 1.3em; margin-top: 40px; color: #ff8a80; }
        .dashboard-info {
            font-size: 1.2em;
            margin-bottom: 20px;
            color: #aaa;
        }
        .control-panel {
            background: #1a1a1a;
            padding: 20px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            border-radius: 5px;
        }
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
        }
        .checkbox-group label {
            background: #2a2a2a;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid #444;
        }
        .checkbox-group label:hover { background: #3a3a3a; }
        .checkbox-group input:checked + span {
            color: var(--highlight);
            font-weight: bold;
        }
        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        select, input {
            background: #222;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px;
            font-family: inherit;
        }
        button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
        }
        button:hover { background: #b71c1c; }
        .table-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .table-wrapper {
            flex: 1;
            min-width: 300px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #1a1a1a;
            color: var(--highlight);
        }
        .rank-1 { color: #ffd700; font-weight: bold; font-size: 1.2em; }
        .rank-2 { color: #c0c0c0; font-weight: bold; }
        .rank-3 { color: #cd7f32; font-weight: bold; }
        #searchResult {
            margin-top: 15px;
            padding: 15px;
            background: #2a1111;
            border-left: 5px solid var(--highlight);
            display: none;
        }
    </style>
</head>
<body>

    <h1>HOLA 業績結算與處刑系統</h1>
    <div class="dashboard-info">
        觀測區間：<span id="dateRange">連線中...準備撕開報表...</span>
    </div>

    <div class="control-panel">
        <h3>戰區選擇 (影響所有排名表)</h3>
        <div class="checkbox-group" id="categoryFilters">
            <label><input type="checkbox" value="028"> <span>028 La-Z-Boy</span></label>
            <label><input type="checkbox" value="082"> <span>082 家具</span></label>
            <label><input type="checkbox" value="066-003"> <span>066-003 床墊/床頭片/下墊</span></label>
            <label><input type="checkbox" value="066-004"> <span>066-004 Kingsdown/SMS</span></label>
        </div>

        <div class="filters">
            <select id="storeSelect">
                <option value="ALL">全部分店 (僅過濾業務員排行)</option>
            </select>
            <input type="text" id="searchInput" placeholder="輸入工號或姓名尋仇...">
            <button onclick="renderDashboard()">重算業績</button>
        </div>
        
        <div id="searchResult"></div>
    </div>

    <div class="table-container">
        <!-- 業務員排行榜 -->
        <div class="table-wrapper">
            <h2>個人戰力 (前30名)</h2>
            <table>
                <thead>
                    <tr>
                        <th>名次</th>
                        <th>業務員</th>
                        <th>淨業績金額</th>
                        <th>店別</th>
                    </tr>
                </thead>
                <tbody id="leaderboard">
                    <tr><td colspan="4" style="text-align:center;">正在通靈中...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- 門市排行榜 -->
        <div class="table-wrapper">
            <h2>全台門市指數 (全店排行)</h2>
            <table>
                <thead>
                    <tr>
                        <th>名次</th>
                        <th>店別</th>
                        <th>淨業績金額</th>
                    </tr>
                </thead>
                <tbody id="storeLeaderboard">
                    <tr><td colspan="3" style="text-align:center;">正在通靈中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRA6gIY15zG0FUfGgvIMxrKX4cWUfthgJImBTfG6zIk1Wztv3fIdGi44a3DjwgAMnY6wMhBKYttIt3D/pub?gid=1342555167&single=true&output=csv';
        let rawData = [];

        function parseCSV(text) {
            let rows = [], row = [], curr = '', inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                if (char === '"') {
                    if (inQuotes && text[i+1] === '"') { curr += '"'; i++; } 
                    else { inQuotes = !inQuotes; }
                } else if (char === ',' && !inQuotes) {
                    row.push(curr); curr = '';
                } else if ((char === '\n' || char === '\r') && !inQuotes) {
                    if (char === '\r' && text[i+1] === '\n') i++;
                    row.push(curr); rows.push(row); row = []; curr = '';
                } else { curr += char; }
            }
            if (curr || row.length) { row.push(curr); rows.push(row); }
            return rows;
        }

        async function init() {
            try {
                const res = await fetch(CSV_URL);
                const text = await res.text();
                rawData = parseCSV(text);
                
                let dateStr = "公司不敢面對的某個時期";
                for(let i = 1; i < rawData.length; i++) {
                    if(rawData[i][18] && rawData[i][18].trim() !== '') {
                        dateStr = rawData[i][18].trim();
                        break;
                    }
                }
                document.getElementById('dateRange').innerText = dateStr;

                let stores = new Set();
                for(let i = 1; i < rawData.length; i++) {
                    if(rawData[i][0]) stores.add(rawData[i][0].trim());
                }
                const storeSelect = document.getElementById('storeSelect');
                stores.forEach(store => {
                    if(store) storeSelect.innerHTML += `<option value="${store}">${store}</option>`;
                });

                renderDashboard();
            } catch (error) {
                document.getElementById('leaderboard').innerHTML = `<tr><td colspan="4">爛磁場干擾，讀取失敗。</td></tr>`;
            }
        }

        function formatMoney(num) {
            return "$" + num.toLocaleString('en-US');
        }

        function renderDashboard() {
            const selectedStore = document.getElementById('storeSelect').value;
            const searchKeyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const checkboxes = document.querySelectorAll('.checkbox-group input:checked');
            const activeCats = Array.from(checkboxes).map(cb => cb.value);

            let salesMap = {};
            let storeTotalMap = {};

            for(let i = 1; i < rawData.length; i++) {
                let row = rawData[i];
                if(row.length < 11) continue;

                let store = row[0] ? row[0].trim() : '幽靈分店';
                let rep = row[2] ? row[2].trim() : '無名氏';
                let subDept = parseInt(row[6], 10);
                let cls = parseInt(row[7], 10);
                let amount = parseInt(row[10], 10) || 0;

                let matchCat = false;
                if (activeCats.length === 0) {
                    matchCat = true;
                } else {
                    for (let cat of activeCats) {
                        if (cat === '028' && subDept === 28) matchCat = true;
                        if (cat === '082' && subDept === 82) matchCat = true;
                        if (cat === '066-003' && subDept === 66 && cls === 3) matchCat = true;
                        if (cat === '066-004' && subDept === 66 && cls === 4) matchCat = true;
                    }
                }
                
                if (!matchCat) continue;

                // 累加門市總業績 (不受下拉選單影響)
                if (!storeTotalMap[store]) storeTotalMap[store] = 0;
                storeTotalMap[store] += amount;

                // 累加個人業績 (受下拉選單影響)
                if (selectedStore !== 'ALL' && store !== selectedStore) continue;

                if (!salesMap[rep]) {
                    salesMap[rep] = { name: rep, store: store, total: 0 };
                }
                salesMap[rep].total += amount;
            }

            // 渲染業務員排行榜
            let sortedSales = Object.values(salesMap).sort((a, b) => b.total - a.total);
            let tbody = '';
            let limit = Math.min(30, sortedSales.length);
            for(let i = 0; i < limit; i++) {
                let data = sortedSales[i];
                let rankClass = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : '';
                tbody += `<tr><td class="${rankClass}">${i + 1}</td><td>${data.name}</td><td>${formatMoney(data.total)}</td><td>${data.store}</td></tr>`;
            }
            if(sortedSales.length === 0) tbody = `<tr><td colspan="4" style="text-align:center;">沒半個活人賣出東西。</td></tr>`;
            document.getElementById('leaderboard').innerHTML = tbody;

            // 渲染門市排行榜
            let sortedStores = Object.entries(storeTotalMap)
                                     .map(([storeName, total]) => ({ storeName, total }))
                                     .sort((a, b) => b.total - a.total);
            let storeBody = '';
            for(let i = 0; i < sortedStores.length; i++) {
                let sData = sortedStores[i];
                let rankClass = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : '';
                storeBody += `<tr><td class="${rankClass}">${i + 1}</td><td>${sData.storeName}</td><td>${formatMoney(sData.total)}</td></tr>`;
            }
            if(sortedStores.length === 0) storeBody = `<tr><td colspan="3" style="text-align:center;">全台門市集體原地往生。</td></tr>`;
            document.getElementById('storeLeaderboard').innerHTML = storeBody;

            // 仇人搜尋邏輯
            let searchDiv = document.getElementById('searchResult');
            if (searchKeyword) {
                let foundIndex = sortedSales.findIndex(s => s.name.toLowerCase().includes(searchKeyword));
                if (foundIndex !== -1) {
                    let target = sortedSales[foundIndex];
                    searchDiv.style.display = 'block';
                    searchDiv.innerHTML = `<strong>尋仇結果：</strong> 業務員 <strong>${target.name}</strong> 
                        排名第 <strong>${foundIndex + 1}</strong>，
                        淨業績 <strong>${formatMoney(target.total)}</strong> (店別: ${target.store})。`;
                } else {
                    searchDiv.style.display = 'block';
                    searchDiv.innerHTML = `<strong>尋仇結果：</strong> 找不到這傢伙，八成是被那些醜不拉磯的低背沙發給壓死了。`;
                }
            } else {
                searchDiv.style.display = 'none';
            }
        }

        window.onload = init;
    </script>
</body>
</html>
